<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303C55" />
      <stop offset="100%" stop-color="#172030" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3A6C8" />
      <stop offset="50%" stop-color="#B8A8F4" />
      <stop offset="100%" stop-color="#8DBBE8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#B8A8F4" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Abstract 3D Torus/Orbit accent -->
  <ellipse cx="32" cy="32" rx="22" ry="12" fill="none" stroke="url(#accent)" stroke-width="2.5" transform="rotate(-25 32 32)" opacity="0.6"/>
  <!-- Monogram -->
  <text x="32" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#F5F3F8" text-anchor="middle" letter-spacing="-0.5">CP<tspan fill="#F3A6C8">.</tspan></text>
</svg>
